name: Sale Refresh (daytime)

# FANZAのセールの入れかわり（10時）に合わせて、全部の売り場のセールを読み直す。
# 運営者の「FANZAの動画は、だいたい10時にいつもセールの更新が入る」→「動画基準で全ての売り場はもう10時更新で統一しちゃおう」（2026-10-10）。
# 毎日の更新（0:05）だけだと、10時に始まったセールが、次の日の0時すぎまでサイトに出なかった（9:59に終わったセールは、ブラウザで隠れるので、その日の昼からはセールが少なく見えた）。
# ・動画: 人気順の上位1,000本と新着の人気順の上位500本を読み直し、セール中の作品（sale.json）とセールの履歴（sale_history.json）・作品ごとの値段の記録（price_history.json）だけを新しくする（get_new_releases.py --sales-only）
# ・同人・ゲーム・アニメ・素人・成人映画・コミック・写真集・VR見放題: 0:05 と同じく集め直す（scripts/doujin_game.py --update。価格・セールの札・人気の順位・
#   人気の動き・セールの記録。同じ日に2回動いても、その日の記録はあとのほうで上書きするだけ）
# ・動画は、人気順の上位5万本まで読み、このサイトに無いセール中の作品も特集ごとに48本まで保存する（運営者の「日替わりセールはFANZAで51本なのに、サイトは1本」。2026-10-10。
#   日替わりセールは0時に入れかわるので、0:35 にも動画のセールだけ読み直す。5万本を読むのに20分ほど）
# ・素人・アニメ・成人映画は、キャンペーン（「○○他30％OFF」など）の名前ごとの本数と、このサイトに無い対象作品も集める（scripts/floor_sales.py。
#   運営者の「素人のセールも、動画みたいに『○○セール』ごとに」。2026-10-12。キャンペーンは0時に入れかわるので、0:35 だけ。はじめは上位1万本だけ読み（5分ほど）、
#   セールの顔ぶれが変わった日・3日ごとだけ5万本まで（20分ほど）。
#   動画のセールを保存・公開したあとに読み、終わったら、もう一度保存・公開する）
# Gemini は使わない。変わったときだけ保存して、公開（deploy.yml）を頼む。手動でも動かせる（Actions の画面の「Run workflow」）
on:
  schedule:
    - cron: '17 1 * * *'  # 日本時間 10:17（10時の入れかわりのすぐあと。10円セールの確認 10:12 のあと）
    - cron: '35 15 * * *' # 日本時間 0:35（0時に入れかわる日替わりセールなど。動画のセールと、素人・アニメ・成人映画のキャンペーン。売り場の集め直しは 0:05 の毎日の更新）
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# 毎日の更新・取り直し・10円セールの確認と重ならないように、同じ順番待ちに並ぶ（データが混ざらないように）
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 100  # 動画の5万本で20分ほど・売り場の集め直しで数分（10:17）・素人などのキャンペーンで25分ほど（0:35）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 動画のセール（失敗しても、売り場の読み直しは続ける。前のデータを残す）
      - name: Refresh sales (video)
        continue-on-error: true
        timeout-minutes: 35
        env:
          API_ID: ${{ secrets.API_ID }}
          AFFILIATE_ID: ${{ secrets.AFFILIATE_ID }}
        run: python get_new_releases.py --sales-only
      # 同人・ゲームなどの売り場（0:05 と同じ集め直し。失敗した売り場は前のデータのまま）
      - name: Refresh floors (doujin, games and others)
        if: github.event.schedule != '35 15 * * *'
        continue-on-error: true
        timeout-minutes: 25
        env:
          API_ID: ${{ secrets.API_ID }}
          AFFILIATE_ID: ${{ secrets.AFFILIATE_ID }}
        run: python scripts/doujin_game.py --update
      - name: Commit and deploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 保存するのは、動画のセールと、売り場のデータ・人気の動き・セールの記録だけ
          git add -- site/src/data/sale.json site/src/data/sale_history.json \
            site/src/data/doujin.json site/src/data/game.json site/src/data/anime.json site/src/data/amateur.json \
            site/src/data/cinema.json site/src/data/comic.json site/src/data/photo.json site/src/data/vr.json \
            site/src/data/floor_rank_history.json site/src/data/floor_sale_history.json
          # 作品ごとの値段の記録（sale.json を書いたときに足す。issue #183）。はじめて書く日まで無いので、あるときだけ（無いファイルを名前で指定すると git add が失敗する）
          if [ -f site/src/data/price_history.json ]; then git add -- site/src/data/price_history.json; fi
          if git diff --staged --quiet; then
            echo "データに変更なし。保存しません。"
            exit 0
          fi
          git commit -m "セールの読み直し: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          # 公開を頼む（ワークフローが保存したコミットでは、ほかのワークフローが自動では動かないため）
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
          echo "### 🚀 セール・売り場のデータが変わったので、公開を頼みました（Deploy）" >> "$GITHUB_STEP_SUMMARY"
      # 素人・アニメ・成人映画のキャンペーンごとの本数と対象作品（scripts/floor_sales.py。2026-10-12）。
      # 0:35（と手動）だけ: 素人・アニメのキャンペーンは0時すぎに始まり23:59に終わる（2026-10-12 に本物で確かめた: 素人 0:10〜23:59・アニメ 0:00〜23:59）ので、
      # 10:17 には読まない（10時のセールの読み直しが、素人の5万本＝20分ほどで遅れないように。運営者の「20分って結構かかるね。最適化できない？」。2026-10-12）。
      # 動画のセールを先に保存・公開してから読むので、0時の日替わりセールの公開も遅れない。10時に始まるキャンペーンがあっても、
      # このサイトの作品（10:17 の集め直し）にキャンペーンの名前が付くので、その作品だけのページは出る（本数・ほかの作品は、次の 0:35 から）
      - name: Refresh floor campaigns (amateur, anime, cinema)
        if: github.event.schedule != '17 1 * * *'
        continue-on-error: true
        timeout-minutes: 35
        env:
          API_ID: ${{ secrets.API_ID }}
          AFFILIATE_ID: ${{ secrets.AFFILIATE_ID }}
        run: python scripts/floor_sales.py --update
      - name: Commit and deploy floor campaigns if changed
        if: github.event.schedule != '17 1 * * *'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 保存するのは、キャンペーンごとのデータと、セールの記録（キャンペーンの本数）だけ
          git add -- site/src/data/floor_sale.json site/src/data/floor_sale_history.json
          if git diff --staged --quiet; then
            echo "キャンペーンのデータに変更なし。保存しません。"
            exit 0
          fi
          git commit -m "売り場のキャンペーンの読み直し: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
          echo "### 🚀 素人・アニメなどのキャンペーンが変わったので、公開を頼みました（Deploy）" >> "$GITHUB_STEP_SUMMARY"
