name: Deploy

# サイトをビルドして、全ページを点検し、Cloudflare Workers（静的ファイルだけ）に直接アップロードする（2026-10-28 から。前は Pages。issue #188）。
# Cloudflare 側のビルド（月500回を「あそびトーク」と共有）を使わないため。点検（tests/verify_dist.py）に通ったものだけを公開する。
#   - main に入ったとき（PR の Merge）→ 本番（https://av-sale-guide.com/）
#   - 毎日の更新（update.yml）・取り直し（refresh-data.yml）がデータを保存したとき → そのワークフローが、これを動かす
#     （GitHub の決まりで、ワークフローが保存したコミットでは、ほかのワークフローが自動では動かないため）
#   - 手動実行（Actions の画面の「Run workflow」）: main を選べば本番、ほかのブランチを選べばプレビュー
#     （<ブランチ名を英数字とハイフンにしたもの>-av-sale-guide.juice-juice-0402.workers.dev。本番は変わらない）
# 鍵は GitHub の Secrets（CLOUDFLARE_WORKERS_TOKEN・CLOUDFLARE_ACCOUNT_ID）。
# Pages（2万ファイルまで）には出さない。Pages のプロジェクト fanza-ranking は fanza-ranking.pages.dev の転送のために残す
# （戻すときは docs/architecture.md の「Workers への引っ越し」。scripts/deploy_pages.sh は戻すときのために残してある）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 続けて Merge したときは、古いほうを止めて、いちばん新しい main だけを公開する（新しいほうに全部入っているため。
# アップロードの途中で止めても、公開が切りかわるのは最後なので、前の公開のまま残る）
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40  # ビルドと点検で10分ほど・アップロードで数分（4万ファイルまで。変わったファイルだけ送る）
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      # ビルド → 全ページの点検（18歳確認・広告表記・クレジットなど）。テスト一式は PR の CI で済んでいるので、ここではしない
      # （データの日々の変化で、公開が止まりにくいように）。点検に落ちたら公開しない（前の公開のまま）
      - name: Build and verify
        shell: bash
        run: |
          (cd site && npm ci --no-audit --no-fund && npm run build) 2>&1 | tee "$RUNNER_TEMP/build.log"
          python3 tests/verify_dist.py 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      # 検索エンジンに知らせるページをえらぶ（本番のときだけ。scripts/indexnow.py。2026-10-17）。
      # 本番にある前回の記録（/indexnow-pages.json）とくらべて、新しいページ・コメントや記事が入ったページ（一覧などは7日に1回まで）をえらび、
      # 今回の記録をサイトといっしょに公開する（main にはコミットしない）。うまく動かなくても公開は止めない
      # 前の公開で受け付けてもらえなかったページ（GitHub の Actions の置き場 cache。いちばん新しいもの）を読む → 今回もう一度えらぶ
      - name: Restore pages to send again (IndexNow)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .indexnow-retry.json
          key: indexnow-retry-${{ github.run_id }}
          restore-keys: indexnow-retry-

      - name: Choose pages to tell search engines (IndexNow)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        run: python3 scripts/indexnow.py prepare --out "$RUNNER_TEMP/indexnow-urls.json" --retry .indexnow-retry.json

      # 本番（main）は Cloudflare Workers へ（連絡 C-012・issue #188。Workers は有料プランで10万ファイルまで・Pages は2万まで）。
      # workers/wrangler.jsonc の routes で、av-sale-guide.com は Workers から出る。ほかのブランチ（手動実行）はプレビュー。
      # アップロードできたら印（UPLOADED_MARK）を付け、IndexNow で知らせる（scripts/deploy_workers.sh）
      - name: Upload to Cloudflare Workers
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REF_NAME: ${{ github.ref_name }}
          UPLOADED_MARK: ${{ runner.temp }}/uploaded
        run: |
          if [ "$REF_NAME" = "main" ]; then
            bash scripts/deploy_workers.sh production
          else
            bash scripts/deploy_workers.sh preview "$REF_NAME"
          fi

      # 検索エンジンに知らせる（IndexNow。Bing・Yandex・Naver・Seznam・Yep。Google は sitemap と Search Console のまま）。
      # 本番にアップロードできたときだけ（印 uploaded）。あとの公開に止められたときも、アップロード済みなら知らせる（always()）。
      # 1万件ずつ送り、結果は注記に1行。失敗しても公開は止めない
      - name: Tell search engines (IndexNow)
        id: indexnow
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        run: python3 scripts/indexnow.py send --list "$RUNNER_TEMP/indexnow-urls.json" --uploaded "$RUNNER_TEMP/uploaded" --retry-out .indexnow-retry.json

      # 受け付けてもらえなかったページを、次の公開のためにとっておく（全部受け付けられたら空。知らせる手順が動いたときだけ。main にはコミットしない）
      - name: Keep pages to send again (IndexNow)
        if: always() && steps.indexnow.outputs.retry == 'written'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .indexnow-retry.json
          key: indexnow-retry-${{ github.run_id }}-${{ github.run_attempt }}

      # 失敗したときだけ、ログの大事なところを「注釈」に出す（ログ全体を開かなくても、理由が読める）
      - name: Show why it failed
        if: failure()
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/build.log" <<'PY'
          import re, sys
          try:
              lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          except OSError:
              lines = ["（ビルドのログがありません。アップロードで失敗したときは、上の注釈を見てください）"]
          lines = [re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", l).rstrip() for l in lines]
          marks = [l for l in lines if "❌" in l or re.search(r"\berror\b|Error:|failed", l, re.I)][:20]
          text = "\n".join(marks + ["--- ログの終わり ---"] + lines[-25:])[-3500:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=公開できなかった理由（ログの抜粋）::" + text)
          PY
