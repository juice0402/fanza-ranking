name: Agency sample (branch only)

# 所属事務所の公式サイトから「所属・X・Instagram」を集める見本づくり（運営者が「まずは見本で確かめる」を選んだ。2026-10-05）。
# このブランチに push したときだけ動く。サイトのデータには書かず、集めた結果（事務所・名前・X・Instagram・出どころのURLだけ）を
# このブランチの agency_sample/ に置くだけ（相手のページの文章・画像は置かない）。
on:
  push:
    branches: ['claude/agency-sample']

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect
        run: python scripts/agency_links.py agency_sample/agency_sample.json
      - name: Save to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agency_sample/agency_sample.json
          git commit -m "所属事務所の見本（集めた結果）" || exit 0
          git push
