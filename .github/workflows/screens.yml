name: Screens

# 画面の写真を撮って、形のくずれを調べる（scripts/screens.mjs。運営者の「全域調査してほしい」。2026-10-09）。
# claude/screens-… のブランチを送ると動き、写真と点検の結果を shots/<実行の番号> のブランチに置く。
# 前の shots/… と、動かすのに使った claude/screens-… は、そのときに消す（いちばん新しい写真だけが残る）。
# 手動実行（workflow_dispatch）は、写真のブランチを全部消すだけ。作品の画像は写さない（灰色の箱）。サイトには何も書きこまない
on:
  push:
    branches: ['claude/screens-**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y > /dev/null
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
      # まだ本番に無い状態（10円セールの開催中など）の見た目を見るとき: screens.json に "local": "ten_yen" などを書くと、
      # 見本のデータ（scripts/screens_sample.py）で、ここでサイトをビルドして写す（保存も公開もしない）。点検（verify_dist.py）の結果も一緒に置く
      - name: Build here with sample data (when screens.json has "local")
        run: |
          SAMPLE=$(node -p "require('./scripts/screens.json').local || ''")
          if [ -z "$SAMPLE" ]; then exit 0; fi
          python3 scripts/screens_sample.py "$SAMPLE"
          (cd site && npm ci --no-audit --no-fund && npm run build)
          mkdir -p shots
          python3 tests/verify_dist.py > shots/verify.txt 2>&1 || echo "::warning title=点検::見本のデータでの点検に失敗があります（shots/verify.txt）"
          nohup python3 -m http.server 4321 --directory site/dist > /dev/null 2>&1 &
          sleep 2
      - name: Take screenshots
        run: node scripts/screens.mjs
      - name: Save to a branch (and remove old ones)
        env:
          RUN: ${{ github.run_number }}
          REF: ${{ github.ref_name }}
        run: |
          for b in $(git ls-remote --heads origin 'shots/*' | awk '{print $2}' | sed 's#refs/heads/##'); do git push -q origin --delete "$b" || true; done
          cd shots
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "screens ${RUN}"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/shots/${RUN}"
          cd ..
          git push -q origin --delete "${REF}" || true
          echo "::notice title=写真::shots/${RUN}"

  cleanup:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Remove screenshot branches
        run: |
          for b in $(git ls-remote --heads origin 'shots/*' 'claude/screens-*' | awk '{print $2}' | sed 's#refs/heads/##'); do git push -q origin --delete "$b" || true; done
