name: CI

# プルリクエストを作る/更新するたびに、テストとサイトのビルドを自動で確認します。
# ここが緑(✓)なら、マージしても安全です。赤(×)ならマージしないで、内容を確認してください。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 過去作品が増えると、ビルドと点検に時間がかかる（2万ファイル近くで、10分ほどの見込み）
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # プレビューを作るか決めるため、Merge したときの元（HEAD^1）と比べる

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      # テスト → サイトのビルド → ビルド結果の点検（18歳確認・広告表記などが全ページにあるか）
      # ログは画面にも出しつつ、ファイルにも残す（失敗したとき、理由を注釈に出すため）
      - name: Tests, build and verify
        shell: bash
        run: bash scripts/check.sh --build 2>&1 | tee "$RUNNER_TEMP/check.log"

      # コード・デザインを変えるPRだけ、できあがったサイトを Cloudflare Pages のプレビューに直接アップロードする
      # （<ブランチ名>.fanza-ranking.pages.dev。本番は変わらない。Cloudflare のビルドの回数は使わない。2026-10-09 から）。
      # データだけのPR（毎日のコメント・まとめ記事）には作らない。URL は、注釈と実行結果の要約に出る。
      # プレビューを作れなくても、このチェック（テスト・ビルド・点検）の結果は変えない
      - name: Preview on Cloudflare Pages
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEAD_REF: ${{ github.head_ref }}
        run: bash scripts/deploy_pages.sh preview "$HEAD_REF" HEAD^1

      # 失敗したときだけ、ログの大事なところ（❌の行と、最後の部分）を「注釈」に出す。
      # ログ全体を開かなくても、PRの画面やAPIから理由が読める
      - name: Show why it failed
        if: failure()
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/check.log" <<'PY'
          import re, sys
          try:
              lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          except OSError:
              lines = ["（ログファイルがありません。ビルドの前に失敗した可能性があります）"]
          lines = [re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", l).rstrip() for l in lines]
          marks = [l for l in lines if "❌" in l or re.search(r"\berror\b|Error:|failed", l, re.I)][:20]
          tail = lines[-25:]
          text = "\n".join(marks + ["--- ログの終わり ---"] + tail)
          text = text[-3500:]  # 注釈は長すぎると切られるので、後ろ（原因が出やすい側）を残す
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=CIが失敗した理由（ログの抜粋）::" + text)
          PY
