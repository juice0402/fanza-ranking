name: Agency discovery (branch only)

# 所属事務所の公式サイトを探して、使えるかを調べる下調べ（運営者の「もっとたくさんの事務所と紐付けたい」。2026-10-05）。
# このブランチに push したときだけ動く。結果（会社名・URL・数・一覧の名前の見本）を、このブランチの discovery/ に置くだけ。
on:
  push:
    branches: ['claude/agency-discovery']

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover (deep)
        run: >-
          python scripts/agency_discover.py --deep discovery/deep.json
          http://www.style-1.jp/ https://capsule.bz/ https://cmore.jp/official/ https://lightpro.jp/ https://life-promotion.com/
          https://pub.linx.live/ https://actentertainment.jp/ https://official.nax-pro.com/ http://www.duo-official.com/
          https://girlule-pro.xyz/ http://attractive-llc.net/ https://www.glanzpro.com/ http://www.belltech-pro.com/ http://www.allurepro.com/
      - name: Save to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discovery/
          git commit -m "所属事務所の下調べ（結果）" || exit 0
          git push
