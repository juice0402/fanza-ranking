name: Agency discovery (branch only)

# 所属事務所の公式サイトを探して、使えるかを調べる下調べ（運営者の「もっとたくさんの事務所と紐付けたい」。2026-10-05）。
# このブランチに push したときだけ動く。結果（会社名・URL・数・一覧の名前の見本）を、このブランチの discovery/ に置くだけ。
on:
  push:
    branches: ['claude/agency-discovery']

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect agencies (all sites)
        run: python scripts/agency_links.py --update --force
      - name: Save to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discovery/ site/src/data/agencies.json
          git commit -m "所属事務所の下調べ（結果）" || exit 0
          git push
