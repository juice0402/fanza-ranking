name: Probe FANZA API

# 作業用ブランチ（claude/probe-thumbs）だけの中身: 画像の小さい版を調べる。main には入れない。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe
        run: |
          pip install -q pillow > pip.txt 2>&1 || echo "::notice title=pip::$(tail -c 1500 pip.txt | tr '\n' ' ')"
          python scripts/probe_thumbs3.py 2> err.txt || { echo "::notice title=err::$(tail -c 2500 err.txt | tr '\n' ' ')"; exit 1; }
