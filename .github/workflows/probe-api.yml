name: Probe FANZA API

# FANZA(DMM) アフィリエイトAPI の「本物の応答の形」を調べるだけの手動実行用（データは保存しない・Geminiは使わない）。
# 新しい機能を作る前の下調べに使う。結果は実行ページの「結果の要約」に出る。
on:
  workflow_dispatch:
    inputs:
      only:
        description: '調べる項目の番号（空なら全部。13＝10円セールの安い順・14＝ブックスの価格の形・15＝日中のセールの読み直し（保存しない）・16＝日替わりセール・17＝素人の女の子の情報と売り場ごとの並び・18＝売り場ごとのセールの名前と本数・19＝素人の期間限定セール・20＝期間限定セールの作品と、売り場ごとのセールの終わりの日時）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe
        env:
          API_ID: ${{ secrets.API_ID }}
          AFFILIATE_ID: ${{ secrets.AFFILIATE_ID }}
          PROBE_ONLY: ${{ inputs.only }}
        run: python scripts/probe_api.py
