name: Probe FANZA API

# 作業用ブランチ（claude/probe-images）だけの中身: パッケージ画像の縦横の大きさを調べる。main には入れない。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe
        run: |
          pip install -q opencv-python-headless numpy
          python scripts/probe_images.py
