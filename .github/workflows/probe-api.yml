name: Probe FANZA API

# 作業用ブランチ（claude/probe-images）だけの中身: パッケージ画像の縦横の大きさを調べる。main には入れない。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe
        run: |
          pip install -q "opencv-python-headless==4.10.0.84" "numpy<2.3" > pip.txt 2>&1 || echo "::notice title=pip::$(tail -c 1500 pip.txt | tr '\n' ' ')"
          python scripts/probe_images.py 2> err.txt || { echo "::notice title=err::$(tail -c 2500 err.txt | tr '\n' ' ')"; exit 1; }
