# 使い捨て: Workers（workers.dev）と、いまの本番（Pages の av-sale-guide.com）を、同じページでくらべる（連絡 C-012。2026-10-28）。main には入れない
name: Workers compare
on:
  push:
    branches: [claude/workers-compare]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: くらべる
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sub=$(curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import json,sys; print((json.load(sys.stdin).get('result') or {}).get('subdomain',''))")
          W="https://av-sale-guide.$sub.workers.dev"; P="https://av-sale-guide.com"
          echo "::notice title=workers.dev::$W"
          diffs=0; lines=""
          for p in / /item/mkmp00761/ /item/mkmp00761 /actress/ /actress/nenpyo/ /sale/ /sale/ending/ /hinban/ /ranking/ /ranking/all/ /doujin/ /sitemap.xml /robots.txt /feed.xml /favicon.svg /data/actresses-index.json /no-such-page-xyz/ ; do
            w=$(curl -s -o /tmp/w -w '%{http_code} %{redirect_url}' "$W$p" | sed "s#$W##"); pp=$(curl -s -o /tmp/p -w '%{http_code} %{redirect_url}' "$P$p" | sed "s#$P##")
            ws=$(wc -c </tmp/w); ps=$(wc -c </tmp/p)
            same=$([ "$w" = "$pp" ] && echo "同じ" || echo "ちがう")
            [ "$same" = "ちがう" ] && diffs=$((diffs+1))
            lines="$lines$p → W:[$w ${ws}B] P:[$pp ${ps}B] $same | "
          done
          echo "::notice title=くらべた結果（ちがう ${diffs}か所）::$lines"
          hw=$(curl -sI "$W/_astro/" -o /dev/null -w '%{http_code}'); 
          cw=$(curl -sI "$W/favicon.svg" | grep -i '^cache-control' | tr -d '\r'); cp=$(curl -sI "$P/favicon.svg" | grep -i '^cache-control' | tr -d '\r')
          xw=$(curl -sI "$W/" | grep -iE '^(x-robots-tag|x-content-type-options|referrer-policy|content-security-policy)' | tr -d '\r' | sort | tr '\n' ';'); xp=$(curl -sI "$P/" | grep -iE '^(x-robots-tag|x-content-type-options|referrer-policy|content-security-policy)' | tr -d '\r' | sort | tr '\n' ';')
          echo "::notice title=_headers のくらべ::favicon W[$cw] P[$cp] ／ トップ W[$xw] P[$xp]"
          mark=$(curl -s "$W/__served-by.txt"); live=$(curl -s "$P/__served-by.txt?cb=$(date +%s)"); echo "::notice title=Workers の印::W[$mark] 本番[$live]"
