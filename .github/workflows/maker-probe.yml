name: Maker probe (branch only)

# メーカーの公式サイトのイベント情報を使ってよいか・読めるかの下調べ（運営者の質問。2026-10-05）。
# このブランチに push したときだけ動き、結果を discovery/ に置くだけ（main には入れない）。
on:
  push:
    branches: ['claude/maker-probe']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe maker sites
        run: |
          mkdir -p discovery
          python scripts/maker_probe.py discovery/maker_probe.json
      - name: Save to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p discovery && touch discovery/.keep
          git add discovery/
          git commit -m "メーカーの公式サイトの下調べ（結果）" || exit 0
          git push origin HEAD:claude/maker-probe
