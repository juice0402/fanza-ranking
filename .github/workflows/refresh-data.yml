name: Refresh FANZA Data

# 「新しい作品の追加」と「AIコメント」はせずに、保存済みデータの取り直しだけを手動で動かす（Geminiは使わない）。
#   ・保存済みの作品の出演者・サンプル動画を、品番で取り直す
#   ・出演者のプロフィール（顔写真・体型・年齢・FANZAの全作品リンク）を取りに行く
#   ・売れ筋ランキングを取り直す
#   ・女優検索の名簿（FANZA公式の出演者検索の一覧）を、続きから取る。ふだんは毎日40回ずつ。
#     「名簿の一覧を取る回数」を増やして実行すると、一気に集められる（全部で約200回。1回100人）
#   ・過去作品（FANZAの人気順の上位1.5万本の、発売済みの作品）を、その日の上位1,000本と新着の人気順を取り直してから、その下を続きから取る。
#     ふだんは毎日30回ずつ（3,000本）。「過去作品の一覧を取る回数」を増やして実行すると、一気に集められる（140回で上位1.5万本が一回り）
# 新しい機能のブランチで、本物のAPIを使った確認をするときにも使う（Run workflow で、ブランチを選んで実行）。
# 結果のデータは、実行したブランチに commit する。
on:
  workflow_dispatch:
    inputs:
      directory_calls:
        description: '女優検索の名簿の一覧を取る回数（1回100人。0〜400。ふだんは40、一気に集めるなら250）'
        required: false
        default: '40'
      catalog_calls:
        description: '過去作品の一覧を取る回数（上位1,000本より下を、1回100本。0〜500。ふだんは30、一気に上位1.5万本を集めるなら140）'
        required: false
        default: '30'

permissions:
  contents: write

# 毎日の更新と重ならないように、順番に1つずつ動かす
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # 名簿（最大400回）と過去作品（最大500回）を一度に取ると、20分ほどかかる
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the script supports refresh-only
        run: |
          # --refresh-only に未対応の古いスクリプトで動かすと、AIコメントまで動いてしまうので、先に確かめて止める
          grep -q -- '--refresh-only' get_new_releases.py || { echo "このブランチの get_new_releases.py は --refresh-only に未対応です。"; exit 1; }

      - name: Refresh data
        env:
          API_ID: ${{ secrets.API_ID }}
          AFFILIATE_ID: ${{ secrets.AFFILIATE_ID }}
          DIRECTORY_CALLS: ${{ inputs.directory_calls || '40' }}
          CATALOG_CALLS: ${{ inputs.catalog_calls || '30' }}
        run: |
          # 回数は数字だけ・名簿は400回まで・過去作品は500回まで（打ちまちがいで、とても長く動かないように）
          case "$DIRECTORY_CALLS" in ''|*[!0-9]*) echo "名簿の一覧を取る回数は、数字で入れてください（いま: $DIRECTORY_CALLS）"; exit 1;; esac
          if [ "$DIRECTORY_CALLS" -gt 400 ]; then echo "名簿の一覧を取る回数は400回までです"; exit 1; fi
          case "$CATALOG_CALLS" in ''|*[!0-9]*) echo "過去作品の一覧を取る回数は、数字で入れてください（いま: $CATALOG_CALLS）"; exit 1;; esac
          if [ "$CATALOG_CALLS" -gt 500 ]; then echo "過去作品の一覧を取る回数は500回までです"; exit 1; fi
          python get_new_releases.py --refresh-only

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 保存するのはデータファイルだけ（他のファイルが紛れ込まないように）
          git add -A -- site/src/data
          if git diff --staged --quiet; then
            echo "データに変更なし。保存しません。"
            exit 0
          fi
          git commit -m "データの取り直し: $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
