name: Refresh FANZA Data

# 「新しい作品の追加」と「AIコメント」はせずに、保存済みデータの取り直しだけを手動で動かす（Geminiは使わない）。
#   ・保存済みの作品の出演者・サンプル動画を、品番で取り直す
#   ・出演者のプロフィール（顔写真・体型・年齢・FANZAの全作品リンク）を取りに行く
#   ・売れ筋ランキングを取り直す
#   ・女優検索の名簿（FANZA公式の出演者検索の一覧）を、続きから取る。ふだんは毎日40回ずつ。
#     「名簿の一覧を取る回数」を増やして実行すると、一気に集められる（全部で約200回。1回100人）
#   ・（「所属事務所」を 1 にしたときだけ）所属事務所とSNSを、事務所の公式サイトから集め直す
#   ・女優のイベント情報を、事務所の公式サイトのイベントの一覧から集め直す（毎回。4つのページを読むだけ）
#   ・過去作品（FANZAの人気順の上位1万本の、発売済みの作品）を、その日の上位1,000本と新着の人気順を取り直してから、その下を続きから取る。
#     ふだんは毎日30回ずつ（3,000本）。「過去作品の一覧を取る回数」を増やして実行すると、一気に集められる（90回で上位1万本が一回り）
#   ・FANZA同人（1,000本）・FANZAゲーム（500本）の人気作品を集め直す（scripts/doujin_game.py。2026-10-09 から）。
#     「同人・ゲームだけ」を 1 にすると、ほかのデータには触らずに、同人・ゲームだけを集める（新しい機能のブランチで、本物のデータを入れて確かめるとき）
# 新しい機能のブランチで、本物のAPIを使った確認をするときにも使う（Run workflow で、ブランチを選んで実行）。
# 結果のデータは、実行したブランチに commit する。
on:
  workflow_dispatch:
    inputs:
      directory_calls:
        description: '女優検索の名簿の一覧を取る回数（1回100人。0〜400。ふだんは40、一気に集めるなら250）'
        required: false
        default: '40'
      catalog_calls:
        description: '過去作品の一覧を取る回数（上位1,000本より下を、1回100本。0〜500。ふだんは30、一気に上位1万本を集めるなら90）'
        required: false
        default: '30'
      agencies:
        description: '所属事務所とSNSを、いますぐ事務所の公式サイトから集め直す（1 で集め直す。ふだんは毎日の更新が週1回）'
        required: false
        default: '0'
      floors_only:
        description: '同人・ゲームだけを集める（1 で、ほかのデータには触らない。ふだんは 0 ＝ ぜんぶ）'
        required: false
        default: '0'

permissions:
  contents: write
  actions: write  # 保存したあと、公開（deploy.yml）を動かすため

# 毎日の更新と重ならないように、順番に1つずつ動かす
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75  # 名簿（最大400回）と過去作品（最大500回）を一度に取ると、20分ほどかかる。所属事務所も集め直すと、さらに10分ほど
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the script supports refresh-only
        if: inputs.floors_only != '1'
        run: |
          # --refresh-only に未対応の古いスクリプトで動かすと、AIコメントまで動いてしまうので、先に確かめて止める
          grep -q -- '--refresh-only' get_new_releases.py || { echo "このブランチの get_new_releases.py は --refresh-only に未対応です。"; exit 1; }

      - name: Refresh data
        if: inputs.floors_only != '1'
        env:
          API_ID: ${{ secrets.API_ID }}
          AFFILIATE_ID: ${{ secrets.AFFILIATE_ID }}
          DIRECTORY_CALLS: ${{ inputs.directory_calls || '40' }}
          CATALOG_CALLS: ${{ inputs.catalog_calls || '30' }}
        run: |
          # 回数は数字だけ・名簿は400回まで・過去作品は500回まで（打ちまちがいで、とても長く動かないように）
          case "$DIRECTORY_CALLS" in ''|*[!0-9]*) echo "名簿の一覧を取る回数は、数字で入れてください（いま: $DIRECTORY_CALLS）"; exit 1;; esac
          if [ "$DIRECTORY_CALLS" -gt 400 ]; then echo "名簿の一覧を取る回数は400回までです"; exit 1; fi
          case "$CATALOG_CALLS" in ''|*[!0-9]*) echo "過去作品の一覧を取る回数は、数字で入れてください（いま: $CATALOG_CALLS）"; exit 1;; esac
          if [ "$CATALOG_CALLS" -gt 500 ]; then echo "過去作品の一覧を取る回数は500回までです"; exit 1; fi
          python get_new_releases.py --refresh-only

      - name: Refresh agencies
        if: inputs.agencies == '1' && inputs.floors_only != '1'
        continue-on-error: true
        timeout-minutes: 30
        run: python scripts/agency_links.py --update --force

      - name: Refresh events
        if: inputs.floors_only != '1'
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/agency_events.py --update

      # FANZA同人・FANZAゲーム（Gemini は使わない。失敗しても、ほかの取り直しは残す）
      - name: Refresh doujin and games
        continue-on-error: true
        timeout-minutes: 15
        env:
          API_ID: ${{ secrets.API_ID }}
          AFFILIATE_ID: ${{ secrets.AFFILIATE_ID }}
        run: python scripts/doujin_game.py --update

      # 10円セール（Gemini は使わない。失敗しても、ほかの取り直しは残す）
      - name: Refresh 10-yen sale
        continue-on-error: true
        timeout-minutes: 10
        env:
          API_ID: ${{ secrets.API_ID }}
          AFFILIATE_ID: ${{ secrets.AFFILIATE_ID }}
        run: python scripts/ten_yen.py --update

      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 保存するのはデータファイルだけ（他のファイルが紛れ込まないように）
          git add -A -- site/src/data
          if git diff --staged --quiet; then
            echo "データに変更なし。保存しません。"
            exit 0
          fi
          git commit -m "データの取り直し: $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          # 公開を頼む（deploy.yml。main なら本番、ほかのブランチならプレビュー）。ワークフローが保存したコミットでは、
          # ほかのワークフローが自動では動かないため（GitHub の決まり）。deploy.yml が無い古いブランチでは頼めないので、注意だけ出す
          if gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"; then
            echo "### 🚀 公開を頼みました（Deploy）" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "::error title=公開を頼めませんでした::Actions の画面から Deploy を手動で動かしてください"
            exit 1
          else
            echo "::warning title=公開を頼めませんでした::このブランチには deploy.yml が無いようです"
          fi
