name: Daily FANZA Update

on:
  schedule:
    - cron: '5 15 * * *' # 毎日 日本時間の午前0時5分（UTC 15:05）。日付が変わった直後に更新して、その日発売の作品を朝から「発売中」にする。ちょうど0時にしないのは、GitHubの定時実行が正時に混み合って遅れやすいため。そのあと 0:20 に Claude がコメントを書き足す
  workflow_dispatch: # GitHubの Actions 画面から「Run workflow」で手動実行もできる

# 更新したデータをリポジトリに保存（commit）するために必要な権限
permissions:
  contents: write

# 手動実行と自動実行が重なっても、順番に1つずつ動かす（データが混ざらないように）
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run update script
        env:
          API_ID: ${{ secrets.API_ID }}
          AFFILIATE_ID: ${{ secrets.AFFILIATE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python get_new_releases.py

      - name: Commit and push if changed
        run: |
          # 保存するのはデータの置き場所（site/src/data）だけ（他のファイルが紛れ込まないように）。
          # 出演者データ・ランキングは最初の実行で新しくできる（まだ無いファイルを名前で指定すると git add が失敗するので、フォルダで指定する）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- site/src/data
          if git diff --staged --quiet; then
            echo "データに変更なし。保存しません。"
            exit 0
          fi
          git commit -m "データ更新: $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          # 更新中に誰かが main を更新していても、取り込んでから保存する
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
