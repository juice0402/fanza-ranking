name: Daily FANZA Update

on:
  schedule:
    - cron: '5 15 * * *' # 毎日 日本時間の午前0時5分（UTC 15:05）。日付が変わった直後に更新して、その日発売の作品を朝から「発売中」にする。ちょうど0時にしないのは、GitHubの定時実行が正時に混み合って遅れやすいため。そのあと 0:20 に Claude がコメントを書き上げる（定時実行が遅れていたら、Claude が手動実行で動かす）
  workflow_dispatch: # GitHubの Actions 画面から「Run workflow」で手動実行もできる

# 更新したデータをリポジトリに保存（commit）するため・保存したあと公開（deploy.yml）を動かすために必要な権限
permissions:
  contents: write
  actions: write

# 手動実行と自動実行が重なっても、順番に1つずつ動かす（データが混ざらないように）
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 週に1回、所属事務所の公式サイトを読む日は、10分ほど長くなる
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # GitHub の定時実行は、混んでいると数時間遅れることがある（2026-10-04 は 0:05 の予定が 3:58 に動いた）。
      # その間に Claude の予約タスク（0:20）が更新を動かしていたら、遅れて来た定時実行は何もしない（Gemini の無料枠を二重に使わないため）。
      # 手動実行（Run workflow）のときは、調べずに動かす
      - name: Skip if today's update is already done
        id: guard
        if: github.event_name == 'schedule'
        run: |
          # 定時実行が順番待ちのあいだに、別の更新が入っていることもあるので、いまの main を取り直して調べる
          git fetch -q --depth=50 origin "${GITHUB_REF_NAME}"
          if bash scripts/already_updated.sh FETCH_HEAD; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "### ⏭ 今日の更新は済んでいたので、定時実行はお休みしました" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run update script
        if: steps.guard.outputs.skip != '1'
        env:
          API_ID: ${{ secrets.API_ID }}
          AFFILIATE_ID: ${{ secrets.AFFILIATE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python get_new_releases.py

      # 所属事務所とSNS（事務所の公式サイトから。前に集めてから7日たっていれば集め直す。それ以外の日は、すぐ終わる）。
      # 失敗しても、ほかの更新は止めない（前のデータを残す。scripts/agency_links.py）
      - name: Update agencies (weekly)
        if: steps.guard.outputs.skip != '1'
        continue-on-error: true
        timeout-minutes: 30
        run: python scripts/agency_links.py --update

      # 女優のイベント情報（所属事務所の公式サイトのイベントの一覧から。毎日。4つのページを読むだけなので、すぐ終わる）。
      # 所属の名前（agencies.json）を使うので、所属事務所のあと。失敗しても、ほかの更新は止めない（前のデータを残す。scripts/agency_events.py）
      - name: Update events (daily)
        if: steps.guard.outputs.skip != '1'
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/agency_events.py --update

      # FANZA同人（1,000本）・FANZAゲーム（500本）の人気作品を集め直す（FANZAのAPIだけ。Gemini は使わない。2026-10-09 から）。
      # アニメ・成人映画・コミック・写真集・VR見放題（各100本）・素人（500本）も（2026-10-10 から。scripts/floor_data.py の FLOORS）。
      # 失敗しても、ほかの更新は止めない（前のデータを残す。scripts/doujin_game.py）
      - name: Update doujin and games (daily)
        if: steps.guard.outputs.skip != '1'
        continue-on-error: true
        timeout-minutes: 25
        env:
          API_ID: ${{ secrets.API_ID }}
          AFFILIATE_ID: ${{ secrets.AFFILIATE_ID }}
        run: python scripts/doujin_game.py --update

      # 読みがな（ジャンル・メーカー・シリーズ・作家。FANZAのAPIだけ。Gemini は使わない。2026-10-10 から）。
      # 7日に1回（読みきれなかった一覧は次の日に続きから）。一覧のページの「50音で探す」と、作品検索をひらがなで探すのに使う。
      # 同人・ゲームなどのデータを集めたあと。失敗しても、ほかの更新は止めない（前のデータを残す。scripts/readings.py）
      - name: Update readings (weekly)
        if: steps.guard.outputs.skip != '1'
        continue-on-error: true
        timeout-minutes: 15
        env:
          API_ID: ${{ secrets.API_ID }}
          AFFILIATE_ID: ${{ secrets.AFFILIATE_ID }}
        run: python scripts/readings.py --update

      # ジャンルのページの「FANZA全体で人気の作品 TOP20」（FANZAのAPIだけ。Gemini は使わない。2026-10-10 から）。
      # 毎日（ジャンルごとに1回）。失敗しても、ほかの更新は止めない（前のデータを残す。scripts/genre_tops.py）
      - name: Update genre tops (daily)
        if: steps.guard.outputs.skip != '1'
        continue-on-error: true
        timeout-minutes: 10
        env:
          API_ID: ${{ secrets.API_ID }}
          AFFILIATE_ID: ${{ secrets.AFFILIATE_ID }}
        run: python scripts/genre_tops.py --update

      # 10円セール（動画・同人・ゲーム。FANZAのAPIだけ。Gemini は使わない。運営者の希望「10円セールは大イベント。開催中はものすごく訴求したい」。2026-10-09 から）。
      # 開催中の日中の入れかわりは ten-yen.yml が確かめる。失敗しても、ほかの更新は止めない（前のデータを残す。scripts/ten_yen.py）
      - name: Update 10-yen sale (daily)
        if: steps.guard.outputs.skip != '1'
        continue-on-error: true
        timeout-minutes: 10
        env:
          API_ID: ${{ secrets.API_ID }}
          AFFILIATE_ID: ${{ secrets.AFFILIATE_ID }}
        run: python scripts/ten_yen.py --update

      - name: Commit and push if changed
        if: steps.guard.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 保存するのはデータの置き場所（site/src/data）だけ（他のファイルが紛れ込まないように）。
          # 出演者データ・ランキングは最初の実行で新しくできる（まだ無いファイルを名前で指定すると git add が失敗するので、フォルダで指定する）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- site/src/data
          if git diff --staged --quiet; then
            echo "データに変更なし。保存しません。"
            exit 0
          fi
          git commit -m "データ更新: $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          # 更新中に誰かが main を更新していても、取り込んでから保存する
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          # 公開を頼む（ビルド・点検・Cloudflare Pages への直接アップロード。deploy.yml）。
          # ワークフローが保存したコミットでは、ほかのワークフローが自動では動かないため（GitHub の決まり）
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
          echo "### 🚀 公開を頼みました（Deploy）" >> "$GITHUB_STEP_SUMMARY"
